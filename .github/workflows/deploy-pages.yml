name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 9.6.0

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install

            - name: Build web for GitHub Pages
              working-directory: web
              env:
                  WEB_BASE_PATH: /${{ github.event.repository.name }}
                  WEB_DEFAULT_API: ${{ vars.WEB_DEFAULT_API || 'http://127.0.0.1:9000' }}
              run: pnpm run build

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: web/build

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/deploy-pages@v4
              id: deployment
